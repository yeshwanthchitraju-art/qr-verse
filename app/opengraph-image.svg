<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(80, 80)">
    <rect width="56" height="56" rx="14" fill="url(#brand)"/>
    <text x="14" y="40" font-family="sans-serif" font-size="28" font-weight="700" fill="white">Q</text>
    <text x="72" y="38" font-family="sans-serif" font-size="28" font-weight="600" fill="white">QRVerse</text>
  </g>
  <text x="80" y="290" font-family="sans-serif" font-size="64" font-weight="700" fill="white">The QR platform</text>
  <text x="80" y="370" font-family="sans-serif" font-size="64" font-weight="700" fill="white">that never gets stale</text>
  <text x="80" y="430" font-family="sans-serif" font-size="28" fill="#94a3b8">Dynamic QR codes, landing pages, and analytics.</text>
  <g transform="translate(80, 490)">
    <rect width="180" height="44" rx="22" fill="rgba(37,99,235,0.15)" stroke="rgba(37,99,235,0.4)"/>
    <text x="90" y="29" font-family="sans-serif" font-size="18" fill="#93c5fd" text-anchor="middle">Dynamic links</text>
    <rect x="200" width="190" height="44" rx="22" fill="rgba(8,145,178,0.15)" stroke="rgba(8,145,178,0.4)"/>
    <text x="295" y="29" font-family="sans-serif" font-size="18" fill="#67e8f9" text-anchor="middle">Editable forever</text>
    <rect x="410" width="230" height="44" rx="22" fill="rgba(13,148,136,0.15)" stroke="rgba(13,148,136,0.4)"/>
    <text x="525" y="29" font-family="sans-serif" font-size="18" fill="#5eead4" text-anchor="middle">Real-time analytics</text>
  </g>
</svg>
